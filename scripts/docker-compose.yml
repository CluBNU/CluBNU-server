version: '3.8'

services:
  clubnu-app:
    image: sso9594/clubnu-api:latest
    container_name: clubnu-app
    ports:
      - "8082:8082"
    depends_on:
      - clubnu-mysql
    environment:
      - REDIS_HOST=clubnu-redis
      - REDIS_PORT=6379
      - DB_HOST=clubnu-mysql
      - DB_PORT=3306
      - DB_SOURCE=clubnu
      - DB_USER=clubnu
      - DB_PASSWORD=clubnu
    networks:
      - clubnu-network
  clubnu-mysql:
    image: mysql:latest
    container_name: clubnu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clubnu
      MYSQL_USER: clubnu
      MYSQL_PASSWORD: clubnu
      TZ: Asia/Seoul
    command: [
      "--character-set-server=utf8mb4",
    ]
    ports:
      - "3306:3306"
    networks:
      - clubnu-network

  clubnu-adminer:
    image: adminer:latest
    container_name: clubnu-adminer
    environment:
      ADMINER_DEFAULT_SERVER: clubnu-mysql
    ports:
      - "18080:8080"
    networks:
      - clubnu-network

  clubnu-redis:
    image: redis:latest
    container_name: clubnu-redis
    ports:
      - "6379:6379"
    networks:
      - clubnu-network

networks:
  clubnu-network:
    driver: bridge
